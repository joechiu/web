<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Query String Demo</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 600px;
      margin: 40px auto;
      padding: 0 20px;
      line-height: 1.6;
    }
    h1 {
      font-size: 1.4rem;
    }
    .box {
      background: #f4f4f4;
      border-radius: 8px;
      padding: 16px;
      margin: 16px 0;
    }
    code {
      background: #e8e8e8;
      padding: 2px 6px;
      border-radius: 4px;
    }
    button {
      padding: 8px 16px;
      font-size: 1rem;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <h1>Query String Reader</h1>

  <p>Try visiting this page with a query string, e.g.:</p>
  <p><code>index.html?name=Joe&age=30</code></p>

  <div class="box">
    <h2>All query parameters:</h2>
    <div id="allParams">(none found)</div>
  </div>

  <div class="box">
    <h2>Specific parameter: <code>name</code></h2>
    <div id="nameParam">(not provided)</div>
  </div>

  <hr>

  <h2>Call the API with this query string</h2>
  <button onclick="callApi()">Send to API</button>
  <div class="box">
    <div id="apiResult">(no result yet)</div>
  </div>

  <script>
    // Parse the URL's query string
    const params = new URLSearchParams(window.location.search);

    // Display all query parameters
    const allParamsDiv = document.getElementById("allParams");
    if ([...params].length > 0) {
      let html = "<ul>";
      for (const [key, value] of params) {
        html += `<li><strong>${key}</strong>: ${value}</li>`;
      }
      html += "</ul>";
      allParamsDiv.innerHTML = html;
    }

    // Display a specific parameter, e.g. "name"
    const nameValue = params.get("name");
    if (nameValue) {
      document.getElementById("nameParam").innerText = nameValue;
    }

    // Call the Render API, passing along the "name" param (or a default)
    async function callApi() {
      const resultDiv = document.getElementById("apiResult");
      resultDiv.innerText = "Loading...";

      const name = params.get("name") || "World";

      try {
        const response = await fetch(`https://web-lty6.onrender.com/api/hello?name=${encodeURIComponent(name)}`);
        const data = await response.json();
        resultDiv.innerText = JSON.stringify(data, null, 2);
      } catch (err) {
        resultDiv.innerText = "Error calling API: " + err;
      }
    }
  </script>

</body>
</html>
