<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Items</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 600px;
      margin: 40px auto;
      padding: 0 20px;
      line-height: 1.6;
    }
    h1 {
      font-size: 1.4rem;
    }
    input {
      display: block;
      width: 100%;
      padding: 8px;
      margin-bottom: 10px;
      box-sizing: border-box;
      font-size: 1rem;
    }
    button {
      padding: 8px 16px;
      font-size: 1rem;
      cursor: pointer;
    }
    .box {
      background: #f4f4f4;
      border-radius: 8px;
      padding: 16px;
      margin: 16px 0;
    }
    ul {
      list-style: none;
      padding: 0;
    }
    li {
      background: white;
      border: 1px solid #ddd;
      border-radius: 6px;
      padding: 10px;
      margin-bottom: 8px;
    }
    .note {
      color: #666;
      font-size: 0.9rem;
    }
    .created {
      color: #999;
      font-size: 0.75rem;
    }
  </style>
</head>
<body>

  <h1>Items</h1>

  <div class="box">
    <h2>Add a new item</h2>
    <input id="nameInput" placeholder="Name">
    <input id="noteInput" placeholder="Note (optional)">
    <button onclick="addItem()">Add Item</button>
  </div>

  <div class="box">
    <h2>All items</h2>
    <div id="items">Loading...</div>
  </div>

  <script>
    // Public API URL — this is NOT a secret, just your API's address.
    // The Supabase key stays safely stored server-side on Render.
    const API_BASE = "https://web-lty6.onrender.com";

    async function loadItems() {
      const container = document.getElementById("items");
      container.innerText = "Loading...";

      try {
        const response = await fetch(`${API_BASE}/api/items`);
        const items = await response.json();

        if (items.error) {
          container.innerText = "Error: " + items.error;
          return;
        }

        if (items.length === 0) {
          container.innerText = "No items yet.";
          return;
        }

        let html = "<ul>";
        items.forEach(item => {
          html += `<li>
            <strong>${escapeHtml(item.name)}</strong><br>
            <span class="note">${escapeHtml(item.note || "")}</span><br>
            <span class="created">${item.created || ""}</span>
          </li>`;
        });
        html += "</ul>";
        container.innerHTML = html;
      } catch (err) {
        container.innerText = "Failed to load items: " + err;
      }
    }

    async function addItem() {
      const name = document.getElementById("nameInput").value.trim();
      const note = document.getElementById("noteInput").value.trim();

      if (!name) {
        alert("Name is required");
        return;
      }

      try {
        const response = await fetch(`${API_BASE}/api/items`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ name, note })
        });

        if (!response.ok) {
          const err = await response.json();
          alert("Error adding item: " + (err.error || response.status));
          return;
        }

        document.getElementById("nameInput").value = "";
        document.getElementById("noteInput").value = "";
        loadItems();
      } catch (err) {
        alert("Failed to add item: " + err);
      }
    }

    // Basic escaping to avoid breaking HTML if item text contains special characters
    function escapeHtml(str) {
      const div = document.createElement("div");
      div.innerText = str;
      return div.innerHTML;
    }

    loadItems();
  </script>

</body>
</html>
